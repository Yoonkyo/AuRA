# anygrasp.yml -- curated minimal conda environment `Anygrasp` for the AnyGrasp inference step
# (aura/grasping/anygrasp_poses_from_pointcloud.py -> `from gsnet import AnyGrasp`). Versions are those of the
# authors' reference environment (captured 2026-09-17) except two transitive pins that had to change
# for pip to resolve against numpy 1.23.5 (see inline comments). The AnyGrasp SDK, its license and its
# checkpoint are NOT part of this repository -- see the steps below.
#
#   conda env create -f environments/anygrasp.yml   # needs gcc/g++ (build-essential): grasp-nms has no Linux wheel and is compiled from its sdist
#   conda activate Anygrasp
#
# WHY A SEPARATE ENV: the AnyGrasp binaries (gsnet.so / lib_cxx.so) use the removed `np.float`
# alias, so numpy MUST stay < 1.24 here, while the main env needs numpy 1.26.
#
# WHY python=3.10.0 + openssl=1.1.1w: the AnyGrasp license library (lib_cxx.so) and license_checker
# link libcrypto.so.1.1 (OpenSSL 1.1) without an RPATH. Ubuntu 24.04 ships only OpenSSL 3, and so do the
# python 3.10.x builds from 3.10.14 on, so this env must provide it: the reference python 3.10.0 pulls in
# openssl 1.1.1w (pins below), and steps 5 and RUNTIME put $CONDA_PREFIX/lib on LD_LIBRARY_PATH.
#
# POST-INSTALL STEPS (in order, from the repository root inside the activated env; a CUDA 12.8 toolkit
# with nvcc and gcc/g++ (13.x on Ubuntu 24.04, build-essential) are required for steps 2-3, and ninja-build is
# recommended: without it the MinkowskiEngine build takes about 7 minutes instead of about 1). Load the
# config first (cp config/aura.env.example config/aura.env once):
#
#   set -a; source config/aura.env; set +a
#
#   # 1. graspnetAPI (--no-deps: it declares the deprecated `sklearn` PyPI shim, which pip refuses to
#   #    install, and an unconstrained `opencv-python`; every real dependency is pinned below)
#   pip install --no-deps graspnetAPI==1.2.10
#
#   # 2. MinkowskiEngine 0.5.4, AnyGrasp's fork (CUDA 12.x branch; reference build = commit 3586275)
#   export CUDA_HOME="${CUDA_HOME:-/usr/local/cuda}"     # must be CUDA 12.8 (nvcc 12.8.x)
#   export PATH="$CUDA_HOME/bin:$PATH"                   # nvcc is usually not on PATH
#   # export TORCH_CUDA_ARCH_LIST="12.0"                  # RTX 50xx (sm_120) if no GPU is visible at build time;
#   #                                                     # then also add --force_cuda to the MinkowskiEngine setup.py
#   #                                                     # call below, or it builds CPU-only (setup.py only warns)
#   git clone -b cuda-12-1 https://github.com/chenxi-wang/MinkowskiEngine.git third_party/MinkowskiEngine
#   git -C third_party/MinkowskiEngine checkout 35862757e2586abc3b1528e012b6d80ce758a92c
#   # REQUIRED, needs sudo: the AnyGrasp SDK README's fix for CUDA 12.8. Without it (tested with gcc 13 on Ubuntu 24.04) the build
#   # fails in bits/shared_ptr_base.h with 'more than one instance of overloaded function "std::__to_address"'. The fix edits a
#   # SYSTEM header that every C++ build on the machine uses: -i.orig keeps the stock header, and the last line restores it.
#   GCC_MAJOR="$(gcc -dumpversion | cut -d. -f1)"
#   sudo sed -i.orig 's/\bauto __raw = __to_address(__r.get());/auto __raw = std::__to_address(__r.get());/' "/usr/include/c++/$GCC_MAJOR/bits/shared_ptr_base.h"
#   (cd third_party/MinkowskiEngine && python setup.py install \
#        --blas_include_dirs="${CONDA_PREFIX}/include" --blas_library_dirs="${CONDA_PREFIX}/lib" --blas=openblas)
#   sudo mv "/usr/include/c++/$GCC_MAJOR/bits/shared_ptr_base.h.orig" "/usr/include/c++/$GCC_MAJOR/bits/shared_ptr_base.h"   # also after a failed build: a second sed would overwrite the backup
#
#   # 3. AnyGrasp SDK (your own clone at $AURA_ANYGRASP_SDK, config/aura.env, default third_party/anygrasp_sdk,
#   #    git-ignored; commit 3cb4a593e1a7cdde6ac897cfce49c26e1c41db9c was used) + pointnet2
#   git clone https://github.com/graspnet/anygrasp_sdk.git "$AURA_ANYGRASP_SDK"
#   git -C "$AURA_ANYGRASP_SDK" checkout 3cb4a593e1a7cdde6ac897cfce49c26e1c41db9c
#   (cd "$AURA_ANYGRASP_SDK/pointnet2" && python setup.py install)
#
#   # 4. Stage the binaries for this Python ABI (3.10 -> cpython-310; delete and re-copy if you change the minor version;
#   #    scripts/anygrasp_poses_one_shot.sh also copies them when they are missing)
#   (cd "$AURA_ANYGRASP_SDK" && \
#    cp grasp_detection/gsnet_versions/gsnet.cpython-310-x86_64-linux-gnu.so grasp_detection/gsnet.so && \
#    cp license_registration/lib_cxx_versions/lib_cxx.cpython-310-x86_64-linux-gnu.so grasp_detection/lib_cxx.so)
#
#   # 5. License (machine-locked; allow days of turnaround; the authors' license will not work on your machine).
#   #    license_checker needs this env's libcrypto.so.1.1 (hence LD_LIBRARY_PATH) and `ifconfig` + `iwconfig`
#   #    on PATH (apt: net-tools, wireless-tools); see environments/README.md, System requirements
#   (cd "$AURA_ANYGRASP_SDK/license_registration" && LD_LIBRARY_PATH="$CONDA_PREFIX/lib" ./license_checker -f)      # prints the feature id without a newline: copy only the id (zsh shows a '%' after it); exit status 1 is normal; "ifconfig: not found" and no id = install net-tools
#   #   -> apply at https://forms.gle/XVV3Eip8njTYJEBo6 ; the returned .zip holds a license/ folder: unzip it into $AURA_ANYGRASP_SDK/grasp_detection/
#   #      so that grasp_detection/license/ holds {licenseCfg.json, <name>.lic, <name>.public_key, <name>.signature}
#   (cd "$AURA_ANYGRASP_SDK/license_registration" && LD_LIBRARY_PATH="$CONDA_PREFIX/lib" ./license_checker -c ../grasp_detection/license/licenseCfg.json)
#
#   # 6. Checkpoint: checkpoint_detection.tar (283 MiB), from the AnyGrasp authors together with your license
#   #    (not in the SDK clone; not redistributable) -> $AURA_ANYGRASP_SDK/grasp_detection/checkpoint_detection.tar
#
# RUNTIME (every invocation of the AnyGrasp step; stage 03 of scripts/anygrasp_poses_one_shot.sh does this):
#   export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"   # libcrypto.so.1.1 for lib_cxx.so (no RPATH); MinkowskiEngine finds OpenBLAS through its own RPATH
#   export PYTHONPATH="$AURA_ANYGRASP_SDK/grasp_detection${PYTHONPATH:+:$PYTHONPATH}"  # `import gsnet`
#   cd "$AURA_ANYGRASP_SDK/grasp_detection"                                         # the license is resolved relative to cwd
#   python "$AURA_REPO_ROOT/aura/grasping/anygrasp_poses_from_pointcloud.py" --checkpoint_path ./checkpoint_detection.tar ...
#
#   # Sanity check (needs your license; run in $AURA_ANYGRASP_SDK/grasp_detection with the exports above). Success is the line
#   # `Anygrasp env OK`: if the license check fails, it prints `[ERROR] license failed to pass!` and still exits with status 0.
#   python -c "import numpy, torch, MinkowskiEngine, pointnet2, open3d; from gsnet import AnyGrasp; assert numpy.__version__ < '1.24'; print('Anygrasp env OK')"
#   # The exports outlive `conda deactivate`: start robot scripts and the lift one-shot from a new terminal.
name: Anygrasp
channels:
  - defaults
  - anaconda
dependencies:
  - python=3.10.0               # exact reference version, do not relax: its build pulls in openssl 1.1.1 (next line), while an unpinned python=3.10 resolves to 3.10.20 + OpenSSL 3 and lib_cxx.so then fails to load. The gsnet/lib_cxx binaries are selected per Python minor version (cpython-310)
  - openssl=1.1.1w              # REQUIRED: libcrypto.so.1.1 for the AnyGrasp license library (lib_cxx.so) and license_checker; Ubuntu 24.04 ships only libcrypto.so.3
  - pip
  - openblas-devel              # BLAS for the MinkowskiEngine build (`--blas=openblas`)
  - libopenblas
  - nomkl
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - numpy==1.23.5           # MUST stay < 1.24
      - scipy==1.15.3
      - pillow==12.2.0
      - tqdm==4.67.3
      - open3d==0.19.0
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - triton==3.6.0
      - cython==3.2.5           # runtime requirement of grasp-nms; pip compiles grasp-nms in an isolated build env with the latest Cython/numpy, not this pin
      # --- graspnetAPI==1.2.10 runtime deps (graspnetAPI itself is installed --no-deps, see header) ---
      - grasp-nms==1.0.2        # built from source: needs gcc/g++
      - transforms3d==0.3.1
      - trimesh==4.12.2
      - opencv-python==4.10.0.84   # reference env had 4.13.0.92, whose metadata demands numpy>=2 (pip refuses it next to numpy 1.23.5); 4.10.0.84 (like 4.11.0.86) still accepts numpy 1.x on Python 3.10. Not imported by the v1 script; graspnetAPI imports cv2 at import time
      - matplotlib==3.10.9
      - contourpy==1.3.2
      - pywavefront==1.3.3
      - scikit-image==0.24.0       # reference env had 0.25.2 (requires numpy>=1.24); 0.24.0 is the last release that accepts numpy 1.23
      - scikit-learn==1.7.2
      - autolab-core==1.1.1
      - autolab-perception==1.0.0
      - cvxopt==1.3.3
      - dill==0.4.1
      - h5py==3.16.0
      # autolab-core / autolab-perception / open3d helpers (pinned to the reference env)
      - colorlog==6.10.1
      - joblib==1.5.3
      - multiprocess==0.70.19
      - ruamel.yaml==0.19.1
      - setproctitle==1.3.7
      - ffmpeg-python==0.2.0
      - pyserial==3.5
      - future==1.0.0
      - pyquaternion==0.9.9
      - pandas==2.3.3
      - networkx==3.4.2
      - imageio==2.37.3
      - tifffile==2025.5.10
      - lazy-loader==0.5
      - setuptools==70.2.0
      - wheel==0.46.3
