# AuRA conda environment -- FULL sanitized export (what the authors' machine had, 2026-09-17)
# Source: `conda env export --no-builds` of env `AuRA`, sanitized for release:
#   * `prefix:` line removed
#   * editable (-e) / local (0.0.0) pip entries replaced by pinned git URLs or by
#     post-install steps (see comments inline)
#   * PhysTwin-only builds (diff-gaussian-rasterization, simple-knn, pytorch3d, utils3d)
#     are marked v2-only and are NOT needed for the v1 data-collection pipeline
# Prefer `environments/aura.yml` (the curated minimal v1 environment). This file is kept for
# exact reproduction / archaeology only (UNTESTED as a fresh `conda env create`).
# Known quirks of this export are annotated.
