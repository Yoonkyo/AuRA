# Anygrasp conda environment -- FULL sanitized export (what the authors' machine had, 2026-09-17)
# Source: `conda env export --no-builds` of env `Anygrasp`, sanitized for release:
#   * `prefix:` line removed
#   * locally-built packages (MinkowskiEngine, pointnet2) replaced by build steps (see environments/anygrasp.yml header)
#   * the `sklearn` PyPI shim and the two pip entries that are NOT consistent with numpy==1.23.5
#     (opencv-python 4.13.0.92 needs numpy>=2, scikit-image 0.25.2 needs numpy>=1.24) are annotated:
#     the reference env was assembled by downgrading numpy AFTER those were installed, so a fresh
#     `conda env create -f` of this exact list fails pip resolution. Use `environments/anygrasp.yml` instead.
# numpy < 1.24 is mandatory (gsnet.so uses the removed np.float alias).
# openssl 1.1.1w (pulled in by python 3.10.0) is mandatory too: the AnyGrasp license library (lib_cxx.so)
# and license_checker link libcrypto.so.1.1.
name: Anygrasp
channels:
  - defaults
  - anaconda
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - blas=1.0
  - bzip2=1.0.8
  - ca-certificates=2026.5.14
  - ld_impl_linux-64=2.44
  - libffi=3.3   # pulled in by python 3.10.0 (defaults channel, pkgs/main)
  - libgcc=15.2.0
  - libgcc-ng=15.2.0
  - libgfortran=15.2.0
  - libgfortran5=15.2.0
  - libopenblas=0.3.31
  - libstdcxx=15.2.0
  - libstdcxx-ng=15.2.0
  - libuuid=1.41.5
  - libxcb=1.17.0
  - libzlib=1.3.1
  - ncurses=6.5
  - nomkl=3.0
  - openblas-devel=0.3.31
  - openssl=1.1.1w   # REQUIRED, not a leftover: libcrypto.so.1.1 for the AnyGrasp license library (lib_cxx.so) and license_checker. Pulled in by python 3.10.0 (defaults channel, pkgs/main); a python 3.10.x build with OpenSSL 3 cannot load AnyGrasp
  - packaging=26.0
  - pip=26.1.1
  - pthread-stubs=0.3
  - python=3.10.0
  - readline=8.3
  - sqlite=3.51.2
  - tk=8.6.15
  - wheel=0.46.3
  - xorg-libx11=1.8.12
  - xorg-libxau=1.0.12
  - xorg-libxdmcp=1.1.5
  - xorg-xorgproto=2024.1
  - xz=5.8.2
  - zlib=1.3.1
