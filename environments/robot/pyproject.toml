[project]
name = "aura-robot"
version = "1.0.0"
description = "Runtime environment for the AuRA real-robot scripts (FR3 execution, gamepad teleoperation recording)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fr3",
    "pylibfranka==0.20.5",
    "depthai==3.6.1",
    "opencv-python==4.13.0.92",
    "pygame==2.6.1",
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.uv]
package = false

[tool.uv.sources]
fr3 = { path = "../../third_party/fr3", editable = true }
